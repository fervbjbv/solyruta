
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #2a2b38;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header, footer {
      position: fixed;
      left: 0;
      right: 0;
      background-color: #1e1f2c;
      color: #ffeba7;
      text-align: center;
      padding: 1rem;
      z-index: 1000;
    }

    header {
      top: 0;
    }

    footer {
      bottom: 0;
      font-size: 0.9rem;
    }

    header h1 {
      margin: 0;
      font-size: 1.8rem;
      letter-spacing: 1px;
    }

    .main-content {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 80px 1rem 60px; /* espacio para header y footer */
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: #2a2b38;
      border-radius: 20px;
      padding: 2rem 1.5rem;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
    }

    .card img {
      width: 200px;
      height: 200px;
      margin-bottom: 2rem;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .title {
      margin-bottom: 1rem;
      font-size: 1.5em;
      font-weight: 700;
      color: #f5f5f5;
    }

    .field {
      margin-top: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5em;
      background-color: #1f2029;
      border-radius: 4px;
      padding: .5em 1em;
    }

    .input-icon {
      height: 1em;
      width: 1em;
      fill: #ffeba7;
    }

    .input-field {
      background: none;
      border: none;
      outline: none;
      width: 100%;
      color: #d3d3d3;
      font-size: 1em;
    }

    .input-field::placeholder {
      color: #aaa;
    }

    .field input:focus::placeholder {
      opacity: 0;
      transition: opacity 0.3s;
    }

    .btn {
      margin: 1.5rem 0 0.5rem;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      font-size: .9em;
      text-transform: uppercase;
      padding: 0.6em 1.2em;
      background-color: #ffeba7;
      color: #5e6681;
      box-shadow: 0 8px 24px rgba(255, 235, 167, 0.2);
      transition: all 0.3s ease-in-out;
      cursor: pointer;
      width: 100%;
    }

    .btn:hover {
      background-color: #5e6681;
      color: #ffeba7;
      box-shadow: 0 8px 24px rgba(16, 39, 112, 0.2);
    }
  </style>

  <script>
    function validarLogin(event) {
      event.preventDefault();
      const usuario = document.getElementById("usuario").value;
      const clave = document.getElementById("clave").value;

      if (usuario === "admin" && clave === "1234") {
        window.location.href = "../solyruta/html/menu.php";
      } else {
        alert("Usuario o contraseña incorrectos");
      }
    }
  </script>
</head>

<body>
  <header>
    <h1>BIENVENIDO A SOL Y RUTA</h1>
  </header>

  <div class="main-content">
    <div class="card">
      <h4 class="title">LOGIN</h4>
      <img src="imagenes/IME.jpeg" alt="Imagen de referencia">

      <form onsubmit="validarLogin(event)">
        <div class="field">
          <svg class="input-icon" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
            <path d="M207.8 20.73c-93.45 18.32-168.7 93.66-187 187.1c-27.64 140.9 68.65 266.2 199.1 285.1c19.01 2.888 36.17-12.26 36.17-31.49l.0001-.6631c0-15.74-11.44-28.88-26.84-31.24c-84.35-12.98-149.2-86.13-149.2-174.2c0-102.9 88.61-185.5 193.4-175.4c91.54 8.869 158.6 91.25 158.6 183.2l0 16.16c0 22.09-17.94 40.05-40 40.05s-40.01-17.96-40.01-40.05v-120.1c0-8.847-7.161-16.02-16.01-16.02l-31.98 .0036c-7.299 0-13.2 4.992-15.12 11.68c-24.85-12.15-54.24-16.38-86.06-5.106c-38.75 13.73-68.12 48.91-73.72 89.64c-9.483 69.01 43.81 128 110.9 128c26.44 0 50.43-9.544 69.59-24.88c24 31.3 65.23 48.69 109.4 37.49C465.2 369.3 496 324.1 495.1 277.2V256.3C495.1 107.1 361.2-9.332 207.8 20.73zM239.1 304.3c-26.47 0-48-21.56-48-48.05s21.53-48.05 48-48.05s48 21.56 48 48.05S266.5 304.3 239.1 304.3z"></path>
          </svg>
          <input id="usuario" type="text" placeholder="Usuario" class="input-field" required>
        </div>

        <div class="field">
          <svg class="input-icon" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
            <path d="M80 192V144C80 64.47 144.5 0 224 0C303.5 0 368 64.47 368 144V192H384C419.3 192 448 220.7 448 256V448C448 483.3 419.3 512 384 512H64C28.65 512 0 483.3 0 448V256C0 220.7 28.65 192 64 192H80zM144 192H304V144C304 99.82 268.2 64 224 64C179.8 64 144 99.82 144 144V192z"></path>
          </svg>
          <input id="clave" type="password" placeholder="Contraseña" class="input-field" required>
        </div>

        <button class="btn" type="submit">Entrar</button>
      </form>
    </div>
  </div>

  <footer>
    <p>&copy; 2025 Sol y Ruta. Todos los derechos reservados.</p>
  </footer>
</body>
</html>
